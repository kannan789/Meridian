<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="meridianGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="12" y1="12" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#4F46E5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Container rounded badge -->
  <rect width="48" height="48" rx="12" fill="#0F172A" />

  <!-- Subtle grid meridian coordinate lines -->
  <circle cx="24" cy="24" r="16" stroke="#334155" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6" />
  <ellipse cx="24" cy="24" rx="7.5" ry="16" stroke="#475569" stroke-width="1.2" opacity="0.7" />
  <line x1="8" y1="24" x2="40" y2="24" stroke="#334155" stroke-width="1.2" opacity="0.6" />

  <!-- Meridian Prime Arch & Monogram M -->
  <path 
    d="M13 33V18L24 28L35 18V33" 
    stroke="url(#meridianGrad)" 
    stroke-width="3.5" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Active Orbital Node / Celestial Pivot -->
  <circle cx="24" cy="15" r="3.2" fill="url(#accentGrad)" />
  <circle cx="24" cy="15" r="1.5" fill="#FFFFFF" />
</svg>
